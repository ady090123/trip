<html lang="ko" class="h-full">
<head>

                extend: {
                    colors: {

                    }
                }
            }
        }
    </script>

<body class="bg-slate-50 text-slate-800 min-h-full flex flex-col justify-between selection:bg-sky-500 selection:text-white">

    <div>

                    <span class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-sky-500 to-blue-600 bg-clip-text text-transparent">TripWave</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button id="openQuizModalBtn" class="text-xs font-bold px-3.5 py-2 rounded-xl bg-purple-50 text-purple-600 hover:bg-purple-100 transition active:scale-95">
                        🧩 MBTI 테스트
                    </button>
                    <button id="wishlistTabBtn" class="text-xs font-semibold px-3.5 py-2 rounded-xl bg-sky-50 text-sky-600 hover:bg-sky-100 transition active:scale-95">

                </div>
            </div>
        </header>

        <section class="bg-gradient-to-b from-sky-500 to-blue-600 text-white py-12 px-4 text-center">
            <div class="max-w-xl mx-auto space-y-4">
                <span class="bg-white/20 text-white text-xs font-medium px-3 py-1 rounded-full uppercase tracking-wider">✨ AI 감성 & MBTI 맞춤 추천</span>
                <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight leading-snug">당신의 MBTI와 느낌에 딱 맞는 여행지!</h1>

                <!-- 검색 입력창 -->
                <div class="bg-white p-2 rounded-2xl shadow-xl flex items-center mt-4">
                    <input type="text" id="moodInput" placeholder="예: ENFP, 힐링, 강원도, 휴식하고 싶어" class="flex-1 bg-transparent text-slate-800 placeholder-slate-400 px-3 py-2 text-sm focus:outline-none">
                    <button id="moodSearchBtn" class="bg-sky-500 hover:bg-sky-600 text-white px-5 py-2.5 rounded-xl text-xs font-bold transition active:scale-95">추천받기 ✨</button>
                </div>
            </div>
        </section>

        <!-- 필터 섹션 -->
        <div class="max-w-4xl mx-auto px-4 py-6 space-y-4">
            <!-- 지역 카테고리 -->
            <div class="flex space-x-2 overflow-x-auto pb-1 scrollbar-none" id="categoryFilter">
                <button data-category="all" class="category-btn px-4 py-2 rounded-xl text-xs font-bold bg-sky-500 text-white shadow-sm transition whitespace-nowrap">전체보기</button>
                <button data-category="한국" class="category-btn px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 border border-slate-200 hover:bg-sky-50 transition whitespace-nowrap">🇰🇷 한국</button>
                <button data-category="중국" class="category-btn px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 border border-slate-200 hover:bg-sky-50 transition whitespace-nowrap">🇨🇳 중국</button>
                <button data-category="베트남" class="category-btn px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 border border-slate-200 hover:bg-sky-50 transition whitespace-nowrap">🇻🇳 베트남</button>
                <button data-category="아메리카" class="category-btn px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 border border-slate-200 hover:bg-sky-50 transition whitespace-nowrap">🇺🇸 아메리카/미국</button>

    <!-- MBTI 테스트 모달 -->
    <div id="quizModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-5 animate-fade-in">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 class="text-lg font-bold text-slate-800">🧩 나만의 여행 MBTI 테스트</h3>
                <button id="closeQuizModalBtn" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>

            <!-- 퀴즈 진행 영역 -->
            <div id="quizContent" class="space-y-4">
                <div class="flex justify-between items-center text-xs text-sky-600 font-bold">
                    <span id="quizStepText">질문 1 / 4</span>
                    <span id="quizProgressText">25% 완료</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-2">
                    <div id="quizProgressBar" class="bg-sky-500 h-2 rounded-full transition-all duration-300" style="width: 25%"></div>
                </div>
                <h4 id="quizQuestion" class="font-bold text-slate-800 text-base leading-snug py-2">질문 내용이 여기에 들어갑니다.</h4>
                <div class="space-y-2">
                    <button id="optA" class="w-full text-left p-3.5 bg-slate-50 hover:bg-sky-50 hover:border-sky-200 border border-slate-200 rounded-2xl text-xs font-semibold text-slate-700 transition active:scale-98">선택지 A</button>
                    <button id="optB" class="w-full text-left p-3.5 bg-slate-50 hover:bg-sky-50 hover:border-sky-200 border border-slate-200 rounded-2xl text-xs font-semibold text-slate-700 transition active:scale-98">선택지 B</button>
                </div>
            </div>

            <!-- 결과 출력 영역 -->
            <div id="quizResult" class="hidden text-center space-y-4 py-2">
                <span class="text-4xl">🎉</span>
                <h4 class="text-sm text-slate-500 font-semibold">당신의 여행 MBTI 스타일은?</h4>
                <p id="resultMbti" class="text-3xl font-extrabold text-sky-600 tracking-wider">ENFP</p>
                <p id="resultDesc" class="text-xs text-slate-600 leading-relaxed px-2">자유로운 영혼의 감성 여행가!</p>
                <div class="pt-2 flex space-x-2">
                    <button id="applyMbtiBtn" class="flex-1 bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 rounded-2xl text-xs transition">이 MBTI로 여행지 추천받기</button>
                    <button id="retryQuizBtn" class="px-4 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-2xl text-xs transition">다시하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 푸터 -->

        &copy; 2026 TripWave. 산뜻한 여행의 시작.
    </footer>

                q: "3. 일정 중 예상치 못한 상황이 발생했을 때 당신의 반응은?",
                a: "이유를 빠르게 분석하고 다음 대안을 논리적으로 찾는다. (T)",
                b: "함께 간 친구의 기분이 상하지 않았는지 마음부터 챙긴다. (F)",
                typeA: "T", typeB: "F"
            },
            {
                q: "4. 여행 일정을 준비할 때 당신의 스타일은?",
                a: "시간대별 동선과 맛집, 예비 계획까지 꼼꼼하게 정리! (J)",
                b: "큰 틀만 정해두고 그날 기분에 따라 발길 닿는 대로 이동! (P)",
                typeA: "J", typeB: "P"
            }
        ];

        let wishlist = JSON.parse(localStorage.getItem('tripwave_wishlist')) || [];
        let currentCategory = 'all';
        let currentMbtiFilter = 'all';
        let moodQuery = '';
        let showOnlyWishlist = false;

        // 퀴즈 상태 변수
        let currentQuestionIndex = 0;
        let userMbtiScores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
        let calculatedMbti = "";

        document.addEventListener('DOMContentLoaded', () => {
            renderDestinations();
            updateWishlistCount();
            initEventListeners();
        });

        function resetFilters() {
            currentCategory = 'all';
            currentMbtiFilter = 'all';
            moodQuery = '';
            showOnlyWishlist = false;
            document.getElementById('moodInput').value = '';

            // 카테고리 버튼 초기화
            document.querySelectorAll('.category-btn').forEach(b => {
                b.classList.remove('bg-sky-500', 'text-white');
                b.classList.add('bg-white', 'text-slate-600');
            });
            const allCatBtn = document.querySelector('.category-btn[data-category="all"]');
            if (allCatBtn) {
                allCatBtn.classList.remove('bg-white', 'text-slate-600');
                allCatBtn.classList.add('bg-sky-500', 'text-white');
            }

            // MBTI 버튼 초기화
            document.querySelectorAll('.mbti-btn').forEach(b => {
                b.classList.remove('bg-purple-600', 'text-white');
                b.classList.add('bg-white', 'text-slate-600');
            });
            const allMbtiBtn = document.querySelector('.mbti-btn[data-mbti="all"]');
            if (allMbtiBtn) {
                allMbtiBtn.classList.remove('bg-white', 'text-slate-600');
                allMbtiBtn.classList.add('bg-slate-200', 'text-slate-700');
            }

            renderDestinations();
        }

        function initEventListeners() {
            // 카테고리 필터
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.category-btn').forEach(b => {
                        b.classList.remove('bg-sky-500', 'text-white');
                        b.classList.add('bg-white', 'text-slate-600');
                    });
                    e.target.classList.remove('bg-white', 'text-slate-600');
                    e.target.classList.add('bg-sky-500', 'text-white');

                    currentCategory = e.target.dataset.category;
                    showOnlyWishlist = false;
                    moodQuery = '';
                    document.getElementById('moodInput').value = '';
                    renderDestinations();
                });
            });

            // MBTI 필터
            document.querySelectorAll('.mbti-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.mbti-btn').forEach(b => {
                        b.classList.remove('bg-purple-600', 'text-white', 'bg-slate-200', 'text-slate-700');
                        b.classList.add('bg-white', 'text-slate-600');
                    });
                    e.target.classList.remove('bg-white', 'text-slate-600');
                    e.target.classList.add('bg-purple-600', 'text-white');

                    currentMbtiFilter = e.target.dataset.mbti;
                    renderDestinations();
                });
            });

            // 검색 버튼
            document.getElementById('moodSearchBtn').addEventListener('click', () => {
                moodQuery = document.getElementById('moodInput').value.trim();
                renderDestinations();
            });

            document.getElementById('moodInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    moodQuery = e.target.value.trim();
                    renderDestinations();
                }
            });

            // 찜 목록 보기
            document.getElementById('wishlistTabBtn').addEventListener('click', () => {
                showOnlyWishlist = !showOnlyWishlist;
                const btn = document.getElementById('wishlistTabBtn');
                if (showOnlyWishlist) {
                    btn.classList.add('bg-sky-500', 'text-white');
                    btn.classList.remove('bg-sky-50', 'text-sky-600');
                } else {
                    btn.classList.remove('bg-sky-500', 'text-white');
                    btn.classList.add('bg-sky-50', 'text-sky-600');
                }
                renderDestinations();
            });

            // 모달 열기/닫기
            const modal = document.getElementById('quizModal');
            document.getElementById('openQuizModalBtn').addEventListener('click', () => {
                modal.classList.remove('hidden');
                currentQuestionIndex = 0;
                userMbtiScores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
                document.getElementById('quizContent').classList.remove('hidden');
                document.getElementById('quizResult').classList.add('hidden');
                renderQuiz();
            });

            document.getElementById('closeQuizModalBtn').addEventListener('click', () => {
                modal.classList.add('hidden');
            });

            // 퀴즈 선택지 버튼
            document.getElementById('optA').addEventListener('click', () => handleQuizAnswer('A'));
            document.getElementById('optB').addEventListener('click', () => handleQuizAnswer('B'));

            // 퀴즈 재시작 버튼 (수정된 로직)
            document.getElementById('retryQuizBtn').addEventListener('click', () => {
                currentQuestionIndex = 0; // 문항 인덱스 초기화 추가
                userMbtiScores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
                document.getElementById('quizContent').classList.remove('hidden');
                document.getElementById('quizResult').classList.add('hidden');
                renderQuiz();
            });

            // 계산된 MBTI 적용
            document.getElementById('applyMbtiBtn').addEventListener('click', () => {
                modal.classList.add('hidden');
                moodQuery = calculatedMbti;
                document.getElementById('moodInput').value = calculatedMbti;
                renderDestinations();
            });
        }

        function renderQuiz() {
            const qData = quizQuestions[currentQuestionIndex];
            const total = quizQuestions.length;
            const progress = Math.round(((currentQuestionIndex + 1) / total) * 100);

            document.getElementById('quizStepText').textContent = `질문 ${currentQuestionIndex + 1} / ${total}`;
            document.getElementById('quizProgressText').textContent = `${progress}% 완료`;
            document.getElementById('quizProgressBar').style.width = `${progress}%`;

            document.getElementById('quizQuestion').textContent = qData.q;
            document.getElementById('optA').textContent = qData.a;
            document.getElementById('optB').textContent = qData.b;
        }

        function handleQuizAnswer(choice) {
            const qData = quizQuestions[currentQuestionIndex];
            if (choice === 'A') {
                userMbtiScores[qData.typeA]++;
            } else {
                userMbtiScores[qData.typeB]++;
            }

            currentQuestionIndex++;
            if (currentQuestionIndex < quizQuestions.length) {
                renderQuiz();
            } else {
                showQuizResult();
            }
        }

        function showQuizResult() {
            document.getElementById('quizContent').classList.add('hidden');
            document.getElementById('quizResult').classList.remove('hidden');

            const eOrI = userMbtiScores.E >= userMbtiScores.I ? 'E' : 'I';
            const sOrN = userMbtiScores.S >= userMbtiScores.N ? 'S' : 'N';
            const tOrF = userMbtiScores.T >= userMbtiScores.F ? 'T' : 'F';
            const jOrP = userMbtiScores.J >= userMbtiScores.P ? 'J' : 'P';

            calculatedMbti = `${eOrI}${sOrN}${tOrF}${jOrP}`;
            document.getElementById('resultMbti').textContent = calculatedMbti;

            const descriptions = {
                ENFP: "자유롭고 호기심 많은 감성 여행가! 색다른 경험과 예쁜 풍경을 좋아해요.",
                INFJ: "차분하고 깊이 있게 영감을 찾는 힐링 여행가! 조용하고 고즈넉한 곳을 선호해요.",
                ESTP: "액티비티와 스릴을 즐기는 에너제틱 여행가! 보는 것보다 직접 몸으로 체험하는 게 최고!",
                ISTJ: "알차고 계획적인 완벽 가이드형 여행가! 유적지와 명소를 시간표대로 알차게 탐방해요."
            };

            document.getElementById('resultDesc').textContent = descriptions[calculatedMbti] || `${calculatedMbti} 성향에 꼭 맞는 최적의 맞춤 여행 코스를 찾아드릴게요!`;
        }

        function toggleWishlist(id) {
            if (wishlist.includes(id)) {
                wishlist = wishlist.filter(item => item !== id);
            } else {
                wishlist.push(id);
            }
            localStorage.setItem('tripwave_wishlist', JSON.stringify(wishlist));
            updateWishlistCount();
            renderDestinations();
        }

        function updateWishlistCount() {
            document.getElementById('wishlistCount').textContent = wishlist.length;
        }

        function renderDestinations() {
            const container = document.getElementById('destinationContainer');
            container.innerHTML = '';

            let filtered = destinations.filter(item => {
                let matchesCategory = true;
                if (currentCategory !== 'all') {
                    matchesCategory = item.region === currentCategory;
                }

                let matchesMbtiFilter = true;
                if (currentMbtiFilter !== 'all') {
                    matchesMbtiFilter = item.mbti.some(m => m.includes(currentMbtiFilter));
                }

                let matchesMood = true;
                if (moodQuery !== '') {
                    const q = moodQuery.toLowerCase();
                    matchesMood = item.keywords.some(kw => q.includes(kw.toLowerCase())) || 
                                  item.name.toLowerCase().includes(q) || 
                                  item.desc.toLowerCase().includes(q) ||
                                  item.region.toLowerCase().includes(q) ||
                                  item.mbti.some(m => m.toLowerCase().includes(q));
                }

                const matchesWishlist = !showOnlyWishlist || wishlist.includes(item.id);
                return matchesCategory && matchesMbtiFilter && matchesMood && matchesWishlist;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-16 text-center text-slate-400">
                        <p class="text-3xl mb-2">🏝️</p>
                        <p class="text-sm font-semibold mb-3">검색하신 내용이나 MBTI에 해당되는 여행지를 찾지 못했어요!</p>
                        <button onclick="resetFilters()" class="text-xs bg-sky-500 text-white font-bold px-4 py-2 rounded-xl">전체 목록 다시보기</button>
                    </div>
                `;
                return;
            }

            filtered.forEach(dest => {
                const isLiked = wishlist.includes(dest.id);
                const card = document.createElement('div');
                card.className = 'bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100 hover:shadow-md transition duration-300 animate-fade-in flex flex-col justify-between';
                
                card.innerHTML = `
                    <div class="relative h-48 bg-slate-100 overflow-hidden">
                        <img src="${dest.image}" alt="${dest.name}" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=600&q=80';" class="w-full h-full object-cover hover:scale-105 transition duration-500">
                        <button onclick="toggleWishlist(${dest.id})" class="absolute top-3 right-3 w-9 h-9 bg-white/80 backdrop-blur-md rounded-full flex items-center justify-center text-lg shadow transition active:scale-95">
                            ${isLiked ? '❤️' : '🤍'}
                        </button>
                        <span class="absolute bottom-3 left-3 bg-black/50 backdrop-blur-md text-white text-[11px] font-medium px-2.5 py-1 rounded-full">${dest.region} · #${dest.category}</span>
                        <span class="absolute top-3 left-3 bg-purple-600/90 backdrop-blur-md text-white text-[10px] font-bold px-2 py-0.5 rounded-md">추천: ${dest.mbti.join(', ')}</span>
                    </div>
                    <div class="p-5 flex-1 flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-slate-800 text-base mb-1">${dest.name}</h3>
                            <p class="text-xs text-slate-500 leading-relaxed">${dest.desc}</p>
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-50 flex items-center justify-between">
                            <span class="text-[11px] text-sky-500 font-semibold">${dest.keywords.map(k => '#' + k).slice(0, 3).join(' ')}</span>
                            <button onclick="alert('${dest.name} 상세 페이지로 이동합니다!')" class="text-xs font-semibold text-slate-600 hover:text-sky-600 transition">자세히 보기 &rarr;</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
